services:
  postgres:
    image: postgres:16-alpine
    container_name: mkhtalif-db
    restart: always
    environment:
      POSTGRES_DB: mkhtalif
      POSTGRES_USER: mkhtalif
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mkhtalif']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m

  redis:
    image: redis:7-alpine
    container_name: mkhtalif-redis
    restart: always
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m

  minio:
    image: minio/minio:latest
    container_name: mkhtalif-storage
    restart: always
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: mkhtalif
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    ports:
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 256m

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: mkhtalif-api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://mkhtalif:${DB_PASSWORD}@postgres:5432/mkhtalif
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_ACCESS_KEY: mkhtalif
      S3_SECRET_KEY: ${MINIO_PASSWORD}
      S3_BUCKET: mkhtalif-assets
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: 24h
      JWT_REFRESH_EXPIRATION: 30d
      CORS_ORIGIN: http://${DOMAIN}
    ports:
      - '127.0.0.1:4000:4000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    command: node dist/src/main
    mem_limit: 512m

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://${DOMAIN}/api/v1
        NEXT_PUBLIC_WS_URL: ws://${DOMAIN}
    container_name: mkhtalif-web
    restart: always
    environment:
      NODE_ENV: production
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      - backend
    mem_limit: 512m

  caddy:
    image: caddy:2-alpine
    container_name: mkhtalif-caddy
    restart: always
    ports:
      - '80:80'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    mem_limit: 128m

volumes:
  postgres_data:
  redis_data:
  minio_data:
  caddy_data:
  caddy_config:
